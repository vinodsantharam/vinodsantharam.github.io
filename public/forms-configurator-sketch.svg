<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" width="940" height="600" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">The hidden mandatory choice</title>
  <desc id="desc">Two sketches of a product configurator. Left, what I met: model, storage and colour are picked, but the keyboard step shows two equal cards, "Add keyboard" and "No keyboard", with neither selected and nothing saying a choice is required. The Continue button at the bottom is grey and disabled while the cursor clicks it again and again. Right, what I expected: "No keyboard" is selected by default, the step is labelled optional, and the Continue button is enabled.</desc>

  <!-- card -->
  <rect x="1" y="1" width="938" height="598" rx="20" fill="#FFFFFF" stroke="#E6E6F0" stroke-width="1.5"/>

  <!-- ===================== LEFT: what I met ===================== -->
  <g>
    <text x="40" y="52" font-size="18" font-weight="700" fill="#B3261E">What I met</text>
    <text x="40" y="74" font-size="13" fill="#9A9AB0">everything picked, button still grey</text>

    <!-- picked steps -->
    <g font-size="14">
      <rect x="40" y="96" width="400" height="44" rx="10" fill="#FAFAFD" stroke="#E6E6F0"/>
      <text x="58" y="123" fill="#55556A">Model</text>
      <text x="380" y="123" text-anchor="end" fill="#2A2A3A" font-weight="600">Pro 11″</text>
      <text x="420" y="124" text-anchor="middle" fill="#2E8B57" font-weight="700">✓</text>

      <rect x="40" y="148" width="400" height="44" rx="10" fill="#FAFAFD" stroke="#E6E6F0"/>
      <text x="58" y="175" fill="#55556A">Storage</text>
      <text x="380" y="175" text-anchor="end" fill="#2A2A3A" font-weight="600">256 GB</text>
      <text x="420" y="176" text-anchor="middle" fill="#2E8B57" font-weight="700">✓</text>

      <rect x="40" y="200" width="400" height="44" rx="10" fill="#FAFAFD" stroke="#E6E6F0"/>
      <text x="58" y="227" fill="#55556A">Colour</text>
      <text x="380" y="227" text-anchor="end" fill="#2A2A3A" font-weight="600">Silver</text>
      <text x="420" y="228" text-anchor="middle" fill="#2E8B57" font-weight="700">✓</text>
    </g>

    <!-- keyboard step -->
    <text x="40" y="280" font-size="16" font-weight="700" fill="#2A2A3A">Keyboard</text>
    <rect x="40" y="294" width="400" height="56" rx="12" fill="#FFFFFF" stroke="#C9C9D6" stroke-width="1.5"/>
    <text x="60" y="327" font-size="15" fill="#2A2A3A" font-weight="600">Add keyboard</text>
    <text x="420" y="327" text-anchor="end" font-size="14" fill="#55556A">+$299</text>
    <rect x="40" y="360" width="400" height="56" rx="12" fill="#FFFFFF" stroke="#C9C9D6" stroke-width="1.5"/>
    <text x="60" y="393" font-size="15" fill="#2A2A3A" font-weight="600">No keyboard</text>

    <!-- annotation -->
    <rect x="28" y="254" width="424" height="172" rx="16" fill="none" stroke="#B3261E" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="240" y="446" text-anchor="middle" font-size="13" font-style="italic" fill="#B3261E">required? nothing on the page says so</text>

    <!-- disabled button -->
    <rect x="40" y="478" width="400" height="52" rx="26" fill="#E9E9EF"/>
    <text x="240" y="510" text-anchor="middle" font-size="16" font-weight="600" fill="#A8A8B8">Continue</text>

    <!-- cursor + rage clicks -->
    <g transform="translate(300 500)">
      <path d="M0,0 L0,30 L8,22 L14,36 L20,33 L14,20 L25,20 z" fill="#2A2A3A" stroke="#FFFFFF" stroke-width="1.5"/>
    </g>
    <g stroke="#B3261E" stroke-width="2.5" stroke-linecap="round">
      <line x1="290" y1="490" x2="282" y2="480"/>
      <line x1="300" y1="486" x2="300" y2="474"/>
      <line x1="310" y1="490" x2="318" y2="480"/>
      <line x1="286" y1="500" x2="274" y2="500"/>
    </g>
    <text x="330" y="560" font-size="13" font-style="italic" fill="#B3261E">click. click. click.</text>
  </g>

  <!-- divider -->
  <line x1="470" y1="40" x2="470" y2="560" stroke="#E6E6F0" stroke-width="1.5"/>

  <!-- ===================== RIGHT: what I expected ===================== -->
  <g>
    <text x="500" y="52" font-size="18" font-weight="700" fill="#4B3FB0">What I expected</text>
    <text x="500" y="74" font-size="13" fill="#9A9AB0">"nothing" is the default</text>

    <g font-size="14">
      <rect x="500" y="96" width="400" height="44" rx="10" fill="#FAFAFD" stroke="#E6E6F0"/>
      <text x="518" y="123" fill="#55556A">Model</text>
      <text x="840" y="123" text-anchor="end" fill="#2A2A3A" font-weight="600">Pro 11″</text>
      <text x="880" y="124" text-anchor="middle" fill="#2E8B57" font-weight="700">✓</text>

      <rect x="500" y="148" width="400" height="44" rx="10" fill="#FAFAFD" stroke="#E6E6F0"/>
      <text x="518" y="175" fill="#55556A">Storage</text>
      <text x="840" y="175" text-anchor="end" fill="#2A2A3A" font-weight="600">256 GB</text>
      <text x="880" y="176" text-anchor="middle" fill="#2E8B57" font-weight="700">✓</text>

      <rect x="500" y="200" width="400" height="44" rx="10" fill="#FAFAFD" stroke="#E6E6F0"/>
      <text x="518" y="227" fill="#55556A">Colour</text>
      <text x="840" y="227" text-anchor="end" fill="#2A2A3A" font-weight="600">Silver</text>
      <text x="880" y="228" text-anchor="middle" fill="#2E8B57" font-weight="700">✓</text>
    </g>

    <text x="500" y="280" font-size="16" font-weight="700" fill="#2A2A3A">Keyboard <tspan font-weight="400" font-size="14" fill="#9A9AB0">(optional)</tspan></text>
    <rect x="500" y="294" width="400" height="56" rx="12" fill="#FFFFFF" stroke="#C9C9D6" stroke-width="1.5"/>
    <circle cx="526" cy="322" r="8" fill="none" stroke="#C9C9D6" stroke-width="2"/>
    <text x="546" y="327" font-size="15" fill="#2A2A3A" font-weight="600">Add keyboard</text>
    <text x="880" y="327" text-anchor="end" font-size="14" fill="#55556A">+$299</text>
    <rect x="500" y="360" width="400" height="56" rx="12" fill="#F1EFFC" stroke="#6C5CE7" stroke-width="2.5"/>
    <circle cx="526" cy="388" r="8" fill="none" stroke="#6C5CE7" stroke-width="2"/>
    <circle cx="526" cy="388" r="4" fill="#6C5CE7"/>
    <text x="546" y="393" font-size="15" fill="#2A2A3A" font-weight="600">No keyboard</text>
    <text x="880" y="393" text-anchor="end" font-size="12" fill="#6C5CE7">default</text>

    <rect x="500" y="478" width="400" height="52" rx="26" fill="#6C5CE7"/>
    <text x="700" y="510" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">Continue</text>
    <text x="700" y="560" text-anchor="middle" font-size="13" font-style="italic" fill="#4B3FB0">one click, done</text>
  </g>
</svg>
